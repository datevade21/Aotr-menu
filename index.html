<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!-- ═══ CHỈNH Ở ĐÂY: status "on" = 🟢 | "off" = 🔴 ═══ -->
<script>
const CONFIG = {
  name: "DX21 Hub", badge: "PREMIUM Scripts",
  features: [
    { icon:"🌾", name:"Auto Farm",               status:"on"  },
    { icon:"⚔️", name:"Auto Raid",               status:"on"  },
    { icon:"🌊", name:"Auto Wave",               status:"off" },
    { icon:"🥷", name:"Auto Kaitun",             status:"on"  },
    { icon:"🎲", name:"Auto Roll Family",        status:"on"  },
    { icon:"⚡", name:"Auto Farm Thunder Spear", status:"off" }
  ]
};
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>DX21 • Premium</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root{--g:#00ff7f;--r:#ff2a4d;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;background:#050507;color:#eceef5;font:500 16px/1.4 Rajdhani,system-ui,sans-serif;overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg,.grid3d,.fx2{position:fixed;pointer-events:none}
.bg{inset:0;z-index:0;background:radial-gradient(60vmax 40vmax at 8% -5%,rgba(255,42,77,.26),transparent 60%),radial-gradient(55vmax 40vmax at 100% 105%,rgba(0,255,127,.16),transparent 60%)}
.grid3d{left:-50%;right:-50%;bottom:0;height:55vh;z-index:0;background:linear-gradient(rgba(255,42,77,.28) 1px,transparent 1px) 0 0/100% 48px,linear-gradient(90deg,rgba(255,42,77,.28) 1px,transparent 1px) 0 0/48px 100%;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent 85%);mask-image:linear-gradient(to top,#000,transparent 85%);animation:gm 2.5s linear infinite}
.fx2{inset:0;z-index:3;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),radial-gradient(transparent 55%,rgba(0,0,0,.7))}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 18px 90px}

.top{display:flex;justify-content:space-between;font:700 11px Orbitron,sans-serif;letter-spacing:.25em;color:#8a8d99}
.live i{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:bl 1.2s steps(1) infinite}

.hero{position:relative;text-align:center;padding:52px 16px 42px;margin-top:14px}
.hero::before,.hero::after{content:"";position:absolute;width:30px;height:30px;border:2px solid var(--r);filter:drop-shadow(0 0 6px var(--r))}
.hero::before{top:0;left:0;border-right:0;border-bottom:0}
.hero::after{right:0;bottom:0;border-color:var(--g);border-left:0;border-top:0;filter:drop-shadow(0 0 6px var(--g))}
h1{position:relative;display:block;width:fit-content;margin:0 auto;font:900 clamp(64px,19vw,150px)/1 Orbitron,Impact,sans-serif;letter-spacing:.05em;color:#fff;text-shadow:0 0 18px rgba(255,42,77,.8),0 0 60px rgba(255,42,77,.45)}
h1::before,h1::after{content:attr(data-t);position:absolute;inset:0;mix-blend-mode:screen;clip-path:inset(0 0 100% 0)}
h1::before{color:var(--r);animation:gl 3.2s steps(1) infinite}
h1::after{color:#00e5ff;animation:gl 2.6s steps(1) infinite reverse}
.prem{position:relative;display:flex;width:fit-content;align-items:center;gap:10px;margin:20px auto 0;padding:10px 20px 10px 26px;border-radius:999px;overflow:hidden;font:800 14px/1 Orbitron,sans-serif;letter-spacing:.4em;color:#201500;background:linear-gradient(100deg,#b8860b,#ffe27a 40%,#ffc94d 60%,#b8860b);box-shadow:0 0 28px rgba(255,201,77,.5),inset 0 0 0 1px rgba(255,255,255,.45)}
.prem::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:sh 3s infinite}
#typ{margin-top:22px;min-height:22px;font:600 14px Rajdhani,monospace;letter-spacing:.12em;color:#9aa0b0}
#typ::after{content:"█";margin-left:4px;color:var(--g);animation:bl 1s steps(1) infinite}

.sum{display:flex;align-items:center;gap:16px;margin-top:30px;font-family:Orbitron,sans-serif}
.sum b{font-size:24px}
.sum small{display:block;font:600 10px Rajdhani,sans-serif;letter-spacing:.25em;opacity:.65}
.sum div:last-child{text-align:right}
#onN{color:var(--g);text-shadow:0 0 12px var(--g)}
#offN{color:var(--r);text-shadow:0 0 12px var(--r)}
.bar{flex:1;height:8px;border-radius:9px;background:rgba(255,42,77,.35);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#00b35a,var(--g));box-shadow:0 0 14px var(--g);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.sec{display:flex;align-items:center;gap:12px;margin:28px 0 14px;font:700 12px Orbitron,sans-serif;letter-spacing:.3em;color:#aab0bf}
.sec hr{flex:1;height:1px;border:0;background:linear-gradient(90deg,var(--r),transparent)}

#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:14px}
.card{--c:var(--g);--rgb:0,255,127;position:relative;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015));border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:up .6s calc(var(--i)*.08s + .2s) both;transition:transform .25s,border-color .25s,box-shadow .25s}
.card.off{--c:var(--r);--rgb:255,42,77}
.card::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:4px;border-radius:0 4px 4px 0;background:var(--c);box-shadow:0 0 16px var(--c)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(140px 90px at 100% 50%,rgba(var(--rgb),.2),transparent)}
.card:hover{transform:translateY(-4px);border-color:rgba(var(--rgb),.6);box-shadow:0 12px 40px -12px rgba(var(--rgb),.75)}
.ic{flex:none;width:48px;height:48px;display:grid;place-items:center;font-size:24px;border-radius:12px;background:rgba(var(--rgb),.12);border:1px solid rgba(var(--rgb),.4);box-shadow:inset 0 0 14px rgba(var(--rgb),.25)}
.tx{flex:1;min-width:0}
h3{font:700 18px/1.2 Rajdhani,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.tx p{margin-top:3px;font:700 12px Rajdhani,sans-serif;letter-spacing:.2em;color:var(--c);text-shadow:0 0 10px rgba(var(--rgb),.6)}
.led{position:relative;flex:none;font-size:26px;line-height:1;filter:drop-shadow(0 0 10px var(--c))}
.led::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:ring 1.8s infinite}

footer{margin-top:36px;text-align:center;font:600 11px Orbitron,sans-serif;letter-spacing:.25em;color:#5d606c}
.tick{position:fixed;left:0;right:0;bottom:0;z-index:2;overflow:hidden;background:rgba(5,5,7,.88);border-top:1px solid var(--line);padding:9px 0 calc(9px + env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.trk{display:flex;width:max-content;animation:mq 30s linear infinite;font:700 12px Orbitron,sans-serif;letter-spacing:.3em;color:#7d8190}
.trk span{white-space:nowrap;padding-right:2em}
.trk b{color:var(--r)}

@keyframes bl{50%{opacity:.15}}
@keyframes up{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes sh{to{left:130%}}
@keyframes gm{to{background-position:0 48px,0 0}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes gl{0%,70%,100%{clip-path:inset(0 0 100% 0);transform:none}72%{clip-path:inset(10% 0 70% 0);transform:translate(-5px,0)}76%{clip-path:inset(55% 0 20% 0);transform:translate(5px,0)}80%{clip-path:inset(30% 0 45% 0);transform:translate(-3px,0)}84%{clip-path:inset(75% 0 5% 0);transform:translate(4px,0)}88%{clip-path:inset(0 0 100% 0)}}
@media (max-width:480px){.prem{letter-spacing:.3em;font-size:12px}.hero{padding:44px 6px 34px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="bg"></div><div class="grid3d"></div><div class="fx2"></div>

<main>
  <div class="top"><span class="live"><i></i>LIVE STATUS</span><span id="clk">--:--:--</span></div>

  <header class="hero">
    <h1></h1>
    <div class="prem">👑 <span></span></div>
    <p id="typ"></p>
  </header>

  <section class="sum">
    <div><b id="onN">0</b><small>ACTIVE</small></div>
    <div class="bar"><i></i></div>
    <div><b id="offN">0</b><small>OFFLINE</small></div>
  </section>

  <div class="sec"><span>▌ MODULE STATUS</span><hr><span id="cnt"></span></div>
  <div id="grid"></div>

  <footer>© <span id="yr"></span> DX21 · PREMIUM EDITION</footer>
</main>

<div class="tick"><div class="trk"></div></div>

<script>
const $ = s => document.querySelector(s), F = CONFIG.features;
const isOn = s => ["on","true","green","xanh","🟢"].includes(String(s).toLowerCase());

document.title = CONFIG.name + " • " + CONFIG.badge;
$("h1").textContent = CONFIG.name; $("h1").dataset.t = CONFIG.name;
$(".prem span").textContent = CONFIG.badge;

$("#grid").innerHTML = F.map((o,i) => {
  const a = isOn(o.status);
  return `<article class="card ${a?"":"off"}" style="--i:${i}"><div class="ic">${o.icon}</div><div class="tx"><h3>${o.name}</h3><p>${a?"ACTIVE · RUNNING":"OFFLINE · STOPPED"}</p></div><div class="led">${a?"🟢":"🔴"}</div></article>`;
}).join("");

const n = F.filter(o => isOn(o.status)).length;
$("#onN").textContent = n; $("#offN").textContent = F.length - n; $("#cnt").textContent = F.length + " MODULES";
setTimeout(() => $(".bar i").style.width = (n / F.length * 100) + "%", 150);

const seg = `<span>⚡ ${CONFIG.name} ${CONFIG.badge} <b>✦</b> ${F.map(o => o.name.toUpperCase()).join(" <b>✦</b> ")} <b>✦</b></span>`;
$(".trk").innerHTML = seg.repeat(4);
$("#yr").textContent = new Date().getFullYear();

const T = `> system online // welcome to ${CONFIG.name.toLowerCase()} ${CONFIG.badge.toLowerCase()}`; let k = 0;
(function t(){ $("#typ").textContent = T.slice(0, k++); if (k <= T.length) setTimeout(t, 40); })();

const clk = () => $("#clk").textContent = new Date().toLocaleTimeString("vi-VN", {hour12:false});
clk(); setInterval(clk, 1000);

/* hạt lửa bay nền (nhẹ, tự dừng khi tắt hiệu ứng) */
const cv = $("#fx"), x = cv.getContext("2d"); let W, H, P = [];
const mk = r => ({x:Math.random()*W, y:r?Math.random()*H:H+10, s:Math.random()*2+.5, v:Math.random()*.6+.2, c:Math.random()<.55?"255,42,77":"0,255,127", a:Math.random()*.6+.25});
const rs = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; P = Array.from({length:Math.min(55, W/16|0)}, () => mk(true)); };
function draw(){
  x.clearRect(0,0,W,H);
  for (const p of P){
    p.y -= p.v; p.x += Math.sin(p.y/40)*.3;
    if (p.y < -10) Object.assign(p, mk());
    x.beginPath(); x.fillStyle = `rgba(${p.c},${p.a})`; x.shadowColor = `rgb(${p.c})`; x.shadowBlur = 10;
    x.arc(p.x, p.y, p.s, 0, 7); x.fill();
  }
  if (!matchMedia("(prefers-reduced-motion:reduce)").matches) requestAnimationFrame(draw);
}
addEventListener("resize", rs); rs(); draw();
</script>
</body>
</html>
