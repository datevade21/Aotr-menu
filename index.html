<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeless Stats</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
        h2 { color: #f59e0b; text-align: center; margin: 0 0 14px 0; font-size: 24px; letter-spacing: 1.5px; }
        
        .script-box { background: #0d1117; border: 1px dashed #f59e0b; border-radius: 8px; padding: 10px; margin-bottom: 16px; text-align: center; }
        .script-title { font-size: 11px; color: #f59e0b; font-weight: bold; margin-bottom: 6px; }
        .script-code { background: #161b22; color: #4ade80; font-family: monospace; font-size: 10px; padding: 6px; border-radius: 6px; border: 1px solid #30363d; word-break: break-all; margin-bottom: 6px; user-select: all; text-align: left; max-height: 80px; overflow-y: auto;}
        .btn-copy { background: #238636; color: #fff; border: none; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn-copy:hover { background: #2ea043; }

        .input-group { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #f59e0b; }
        button.btn-search { background: #f59e0b; color: #000; border: none; font-weight: bold; border-radius: 8px; padding: 0 20px; cursor: pointer; transition: 0.2s; }
        button.btn-search:hover { background: #d97706; }

        .stats-box { display: none; background: #0d1117; border-radius: 12px; padding: 18px; border: 1px solid #21262d; margin-top: 10px; }
        .user-header { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #21262d; padding-bottom: 14px; margin-bottom: 14px; }
        .avatar { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #f59e0b; background: #21262d; }
        .user-meta { flex: 1; }
        .display-name { font-weight: bold; font-size: 16px; color: #f0f6fc; }
        .username { font-size: 13px; color: #8b949e; }
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; text-align: center; }
        .badge-online { background: #23863622; color: #3fb950; border: 1px solid #23863655; }
        .badge-offline { background: #da363322; color: #f85149; border: 1px solid #da363355; }
        .stat-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 14px; color: #8b949e; }
        .stat-val { font-weight: bold; color: #58a6ff; }
        .beli-val { font-weight: bold; color: #3fb950; }
        .error { color: #f85149; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
        
        .admin-toggle { text-align: right; font-size: 11px; margin-bottom: 8px; }
        .admin-toggle a { color: #8b949e; text-decoration: none; cursor: pointer; }
        .admin-toggle a:hover { color: #f59e0b; }
        
        .admin-panel { display: none; background: #0d1117; border: 1px solid #f59e0b; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
        .admin-panel input { width: 100%; margin-bottom: 8px; font-size: 13px; padding: 8px; }
        .admin-panel button { background: #238636; color: #fff; border: none; padding: 8px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .error-pass { color: #f85149; font-size: 11px; text-align: center; margin-top: 4px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>HOMELESS STATS</h2>
        
        <div class="admin-toggle">
            <a onclick="toggleAdmin()">⚙️ Cài đặt Link Cloudflare</a>
        </div>

        <!-- Bước 1: Nhập mật khẩu trước -->
        <div id="passPanel" class="admin-panel" style="display: none;">
            <div style="font-size: 12px; color: #f59e0b; font-weight: bold; margin-bottom: 6px;">🔐 NHẬP MẬT KHẨU QUẢN TRỊ</div>
            <input type="password" id="adminPass" placeholder="Nhập mật khẩu...">
            <button onclick="checkPassword()">Xác nhận</button>
            <div id="errorPass" class="error-pass">Sai mật khẩu!</div>
        </div>

        <!-- Bước 2: Chỉ hiện khi nhập đúng mật khẩu -->
        <div id="configPanel" class="admin-panel" style="display: none;">
            <div style="font-size: 12px; color: #3fb950; font-weight: bold; margin-bottom: 6px;">⚡ ĐỔI LINK CLOUDFLARE</div>
            <input type="text" id="newUrl" placeholder="Dán link https://xxx.trycloudflare.com vào đây...">
            <button onclick="saveConfig()" style="background: #f59e0b; color: #000;">Lưu cấu hình</button>
        </div>
        
        <div class="script-box">
            <div class="script-title">⚡ MÃ LUA CHẠY TRONG GAME:</div>
            <div class="script-code" id="luaScriptText">Đang tải mã...</div>
            <button class="btn-copy" onclick="copyScript()">Sao chép Mã Lua</button>
        </div>

        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Nhập Roblox Username...">
            <button class="btn-search" onclick="startTracking()">Tra cứu</button>
        </div>
        
        <div id="errorMsg" class="error"></div>
        
        <div id="statsBox" class="stats-box">
            <div class="user-header">
                <img id="dispAvatar" class="avatar" src="" alt="avatar">
                <div class="user-meta">
                    <div id="dispDisplayName" class="display-name">---</div>
                    <div id="dispUsername" class="username">@---</div>
                </div>
                <span class="badge" id="dispStatus">OFFLINE</span>
            </div>
            <div class="stat-row">
                <span>Trò chơi</span>
                <span class="stat-val" id="dispGame" style="color:#c9d1d9;">---</span>
            </div>
            <div class="stat-row">
                <span>LEVEL</span>
                <span class="stat-val" id="dispLevel">---</span>
            </div>
            <div class="stat-row">
                <span>TIỀN / BELI</span>
                <span class="beli-val" id="dispBeli">$0</span>
            </div>
            <div class="stat-row" style="font-size: 11px; margin-bottom: 0;">
                <span>Cập nhật lúc:</span>
                <span id="dispTime" style="color: #8b949e;">--:--:--</span>
            </div>
        </div>
    </div>

    <script>
        let CLOUDFLARE_URL = localStorage.getItem('cf_url') || "https://recommend-bloomberg-refrigerator-synopsis.trycloudflare.com";

        function toggleAdmin() {
            const passPanel = document.getElementById('passPanel');
            const configPanel = document.getElementById('configPanel');
            
            // Nếu bảng cấu hình đang mở thì ẩn đi, ngược lại thì hiện bảng nhập pass
            if (configPanel.style.display === 'block') {
                configPanel.style.display = 'none';
            } else {
                passPanel.style.display = passPanel.style.display === 'block' ? 'none' : 'block';
            }
            document.getElementById('errorPass').style.display = 'none';
        }

        function checkPassword() {
            const pass = document.getElementById('adminPass').value;
            const errDiv = document.getElementById('errorPass');

            if (pass === "27102012Dat@") {
                document.getElementById('passPanel').style.display = 'none';
                document.getElementById('configPanel').style.display = 'block';
                document.getElementById('adminPass').value = ''; // Xóa pass cho bảo mật
                errDiv.style.display = 'none';
            } else {
                errDiv.style.display = 'block';
            }
        }

        function saveConfig() {
            const url = document.getElementById('newUrl').value.trim();
            if (!url) {
                alert("Vui lòng nhập link Cloudflare!");
                return;
            }

            CLOUDFLARE_URL = url.replace(/\/$/, '');
            localStorage.setItem('cf_url', CLOUDFLARE_URL);
            
            alert("Đã cập nhật link Cloudflare thành công!");
            document.getElementById('configPanel').style.display = 'none';
            document.getElementById('newUrl').value = '';
            loadScriptTemplate();
        }

        function loadScriptTemplate() {
            const luaCode = `local HttpService = game:GetService("HttpService")
local Players = game:GetService("Players")
local player = Players.LocalPlayer

local SERVER_URL = "${CLOUDFLARE_URL}/api/update"
local sendRequest = (syn and syn.request) or (http and http.request) or http_request or request

task.spawn(function()
    while task.wait(3) do
        pcall(function()
            local level = 0
            local beli = 0
            if player:FindFirstChild("Data") then
                if player.Data:FindFirstChild("Level") then level = player.Data.Level.Value end
                if player.Data:FindFirstChild("Beli") then beli = player.Data.Beli.Value end
            end
            local payload = { username = player.Name, game = "Blox Fruits", level = level, beli = beli, status = "IN-GAME" }
            if sendRequest then
                sendRequest({ Url = SERVER_URL, Method = "POST", Headers = { ["Content-Type"] = "application/json" }, Body = HttpService:JSONEncode(payload) })
            end
        end)
    end
end)`;
            document.getElementById('luaScriptText').innerText = luaCode;
        }
        loadScriptTemplate();

        function copyScript() {
            const scriptText = document.getElementById("luaScriptText").innerText;
            navigator.clipboard.writeText(scriptText).then(() => {
                alert("Đã sao chép mã Lua thành công!");
            });
        }

        let loopId = null;

        async function fetchStats() {
            const user = document.getElementById('usernameInput').value.trim();
            const errDiv = document.getElementById('errorMsg');
            const statsBox = document.getElementById('statsBox');

            if (!user) return;

            try {
                const res = await fetch(`${CLOUDFLARE_URL}/api/stats?username=` + encodeURIComponent(user));
                const data = await res.json();

                if (!res.ok) {
                    errDiv.innerText = data.error;
                    errDiv.style.display = 'block';
                    statsBox.style.display = 'none';
                    return;
                }

                errDiv.style.display = 'none';
                statsBox.style.display = 'block';
                
                document.getElementById('dispAvatar').src = data.avatarUrl;
                document.getElementById('dispDisplayName').innerText = data.displayName;
                document.getElementById('dispUsername').innerText = '@' + data.username;
                document.getElementById('dispGame').innerText = data.game;
                document.getElementById('dispLevel').innerText = typeof data.level === 'number' ? 'Lv. ' + data.level.toLocaleString() : data.level;
                document.getElementById('dispBeli').innerText = '$' + Number(data.beli).toLocaleString();
                document.getElementById('dispTime').innerText = data.lastUpdated;

                const statusBadge = document.getElementById('dispStatus');
                statusBadge.innerText = data.status;
                statusBadge.className = 'badge ' + (data.status === 'ONLINE' || data.status === 'IN-GAME' ? 'badge-online' : 'badge-offline');
            } catch (e) {
                errDiv.innerText = 'Lỗi kết nối tới Termux Server (Kiểm tra lại link Cloudflare hoặc Termux đã tắt)';
                errDiv.style.display = 'block';
            }
        }

        function startTracking() {
            if (loopId) clearInterval(loopId);
            fetchStats();
            loopId = setInterval(fetchStats, 3000);
        }
    </script>
</body>
</html>
