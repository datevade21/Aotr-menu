<!DOCTYPE html>
<html lang="vi">
<head>
    <script>
        // ========================================================
        // 1. THAY LINK CLOUDFLARE CỦA BẠN VÀO GIỮA 2 DẤU " " DƯỚI ĐÂY:
        // ========================================================
        const FIXED_API_URL = "https://luis-alert-cooperative-netscape.trycloudflare.com";
        // ========================================================
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byteviet Discord Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); min-height: 100vh; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* HIỆU ỨNG NÚT BẤM (BUTTON ANIMATIONS) */
        .btn-action {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
            box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.4);
        }
        .btn-action:active {
            transform: scale(0.95) translateY(0);
            filter: brightness(0.9);
        }
        /* Hiệu ứng gợn sóng khi nhấp vào */
        .btn-action::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease-out, height 0.3s ease-out;
        }
        .btn-action:active::after {
            width: 200px;
            height: 200px;
            opacity: 0;
        }
    </style>
</head>
<body class="text-slate-100 p-4 sm:p-8 flex justify-center selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-4xl space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
                <i class="fa-brands fa-discord mr-2 animate-pulse"></i>Byteviet Dashboard
            </h1>
            <p class="text-slate-400 text-sm">Điều khiển Treo RPC & Voice từ xa qua Termux</p>
        </div>

        <!-- Cấu hình Token -->
        <div class="glass rounded-2xl p-6 space-y-4 shadow-xl">
            <h2 class="text-md font-semibold text-indigo-300 flex items-center gap-2">
                <i class="fa-solid fa-key"></i> Đăng nhập Discord Token
            </h2>
            <div class="flex gap-3">
                <input type="password" id="discordToken" placeholder="Nhập Discord User Token..." class="w-full bg-slate-900/70 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                <button onclick="login(this)" class="btn-action bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 px-6 py-2.5 rounded-xl font-medium text-sm whitespace-nowrap shadow-lg flex items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Treo RPC -->
            <div class="glass rounded-2xl p-6 space-y-3 shadow-xl">
                <h2 class="text-md font-semibold text-purple-300 flex items-center gap-2">
                    <i class="fa-solid fa-gamepad"></i> Treo Custom RPC
                </h2>
                <input type="text" id="rpcName" placeholder="Tên App (VD: VS Code)" class="w-full bg-slate-900/70 border border-slate-700/80 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
                <input type="text" id="rpcDetails" placeholder="Chi tiết (Details)" class="w-full bg-slate-900/70 border border-slate-700/80 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
                <input type="text" id="rpcState" placeholder="Trạng thái (State)" class="w-full bg-slate-900/70 border border-slate-700/80 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="rpcLargeImage" placeholder="Link Ảnh Lớn" class="bg-slate-900/70 border border-slate-700/80 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
                    <input type="text" id="rpcSmallImage" placeholder="Link Ảnh Nhỏ" class="bg-slate-900/70 border border-slate-700/80 rounded-xl p-2.5 text-sm focus:outline-none focus:border-purple-500 transition">
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="sendApi(this, '/api/rpc', {name: rpcName.value, details: rpcDetails.value, state: rpcState.value, largeImage: rpcLargeImage.value, smallImage: rpcSmallImage.value})" class="btn-action flex-1 bg-gradient-to-r from-purple-600 to-purple-500 py-2.5 rounded-xl text-sm font-medium shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-play"></i> Bật RPC
                    </button>
                    <button onclick="sendApi(this, '/api/stop-rpc', {})" class="btn-action bg-gradient-to-r from-rose-600 to-rose-500 px-4 py-2.5 rounded-xl text-sm font-medium shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-stop"></i> Tắt
                    </button>
                </div>
            </div>

            <!-- Treo Voice -->
            <div class="glass rounded-2xl p-6 space-y-3 flex flex-col justify-between shadow-xl">
                <div class="space-y-3">
                    <h2 class="text-md font-semibold text-pink-300 flex items-center gap-2">
                        <i class="fa-solid fa-microphone-slash"></i> Treo Voice Room
                    </h2>
                    <input type="text" id="guildId" placeholder="Server / Guild ID" class="w-full bg-slate-900/70 border border-slate-700/80 rounded-xl p-2.5 text-sm focus:outline-none focus:border-pink-500 transition">
                    <input type="text" id="channelId" placeholder="Voice Channel ID" class="w-full bg-slate-900/70 border border-slate-700/80 rounded-xl p-2.5 text-sm focus:outline-none focus:border-pink-500 transition">
                    <div class="flex gap-4 text-sm text-slate-300 pt-1">
                        <label class="cursor-pointer flex items-center gap-2 select-none"><input type="checkbox" id="selfMute" checked class="accent-pink-500 rounded"> Tắt Mic</label>
                        <label class="cursor-pointer flex items-center gap-2 select-none"><input type="checkbox" id="selfDeaf" checked class="accent-pink-500 rounded"> Tắt Tai Nghe</label>
                    </div>
                </div>
                <div class="flex gap-2 pt-2">
                    <button onclick="sendApi(this, '/api/voice', {guildId: guildId.value, channelId: channelId.value, selfMute: selfMute.checked, selfDeaf: selfDeaf.checked})" class="btn-action flex-1 bg-gradient-to-r from-pink-600 to-pink-500 py-2.5 rounded-xl text-sm font-medium shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Vào Voice
                    </button>
                    <button onclick="sendApi(this, '/api/stop-voice', {guildId: guildId.value})" class="btn-action bg-gradient-to-r from-rose-600 to-rose-500 px-4 py-2.5 rounded-xl text-sm font-medium shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> Rời
                    </button>
                </div>
            </div>
        </div>

        <!-- Thanh Trạng thái -->
        <div class="glass rounded-xl p-3.5 text-xs font-mono text-slate-300 flex items-center gap-2 shadow-inner" id="statusContainer">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping" id="statusDot"></span>
            <span id="status">Trạng thái: Đang chờ lệnh...</span>
        </div>
    </div>

    <script>
        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(30); // Rung nhẹ thiết bị nếu hỗ trợ
        }

        function setButtonLoading(btn, isLoading) {
            if (isLoading) {
                btn.dataset.originalContent = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang gửi...`;
                btn.style.pointerEvents = 'none';
                btn.style.opacity = '0.75';
            } else {
                btn.innerHTML = btn.dataset.originalContent || btn.innerHTML;
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            }
        }

        function getBaseUrl() {
            let url = FIXED_API_URL.trim();
            if (url.endsWith('/')) url = url.slice(0, -1);
            return url;
        }

        async function login(btn) {
            triggerHaptic();
            const token = document.getElementById('discordToken').value;
            const baseUrl = getBaseUrl();
            if(!token) return alert('Vui lòng nhập Discord Token!');

            setButtonLoading(btn, true);
            const statusText = document.getElementById('status');
            const statusDot = document.getElementById('statusDot');
            statusText.innerText = 'Trạng thái: Đang kết nối Token đến Termux...';
            statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-blue-400 animate-ping';

            try {
                const res = await fetch(`${baseUrl}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                if(data.success) {
                    statusText.innerText = `Trạng thái: Đã đăng nhập tài khoản ${data.user}`;
                    statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-400';
                } else {
                    statusText.innerText = `Lỗi: ${data.error}`;
                    statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-rose-500';
                }
            } catch(e) {
                statusText.innerText = `Lỗi kết nối Termux: ${e.message}`;
                statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-rose-500';
            } finally {
                setButtonLoading(btn, false);
            }
        }

        async function sendApi(btn, path, body) {
            triggerHaptic();
            const baseUrl = getBaseUrl();
            const statusText = document.getElementById('status');
            const statusDot = document.getElementById('statusDot');
            
            setButtonLoading(btn, true);
            statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-blue-400 animate-ping';

            try {
                const res = await fetch(`${baseUrl}${path}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                statusText.innerText = `Kết quả: ${data.message || data.error}`;
                statusDot.className = data.message ? 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-400' : 'inline-block w-2.5 h-2.5 rounded-full bg-rose-500';
            } catch(e) {
                statusText.innerText = `Lỗi gửi lệnh: ${e.message}`;
                statusDot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-rose-500';
            } finally {
                setButtonLoading(btn, false);
            }
        }
    </script>
</body>
</html>
