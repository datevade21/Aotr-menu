<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Controller Panel</title>
<style>
  :root {
    --ink-deep: #12071d; --ink-mid: #250b31; --plum: #671343; --ember: #ff4d7d; --gold: #ffe0b2; --mist: #eddcf5;
    --glass-bg: rgba(23, 10, 36, 0.75); --glass-card: rgba(37, 11, 49, 0.65); --glass-border: rgba(255, 185, 205, 0.18);
    --glass-border-focus: rgba(255, 77, 125, 0.45); --status-active: #00ffb3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { min-height: 100vh; background: var(--ink-deep); font-family: system-ui, -apple-system, sans-serif; color: var(--mist); }
  #scene { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #sky { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 45% at 68% 62%, rgba(255, 120, 150, 0.4) 0%, transparent 60%), linear-gradient(180deg, #12071d 0%, #250b31 100%); }
  #app-workspace { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; }
  .navbar { background: var(--glass-bg); backdrop-filter: blur(16px); border-bottom: 1px solid var(--glass-border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
  .brand-title { font-size: 1.1rem; color: #fff; font-weight: 700; }
  .user-badge { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); padding: 6px 16px; border-radius: 20px; border: 1px solid var(--glass-border); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 0.75rem; text-transform: uppercase; color: rgba(237, 220, 245, 0.7); }
  .input { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--glass-border); border-radius: 6px; padding: 10px 14px; color: #fff; outline: none; }
  .input:focus { border-color: var(--glass-border-focus); }
  .btn { background: linear-gradient(135deg, var(--plum), var(--ember)); border: none; color: #fff; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  .btn-secondary { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); }
  .btn-danger { background: rgba(255, 82, 82, 0.2); border: 1px solid rgba(255, 82, 82, 0.4); color: #ff8a8a; }
  .grid-container { max-width: 1350px; margin: 0 auto; padding: 28px; width: 100%; display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
  .col-6 { grid-column: span 6; } .col-12 { grid-column: span 12; }
  .card-panel { background: var(--glass-bg); backdrop-filter: blur(14px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 24px; }
  .card-header { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--glass-border); font-weight: 600; color: var(--gold); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .worker-item { background: var(--glass-card); border: 1px solid var(--glass-border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
  #auth-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(18, 7, 29, 0.9); backdrop-filter: blur(20px); display: flex; justify-content: center; align-items: center; padding: 20px; }
  .auth-card { background: var(--glass-bg); border: 1px solid var(--glass-border); width: 100%; max-width: 400px; border-radius: 14px; padding: 32px; }
  .auth-tabs { display: flex; border-bottom: 1px solid var(--glass-border); margin-bottom: 24px; }
  .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: rgba(255,255,255,0.5); }
  .auth-tab.active { color: var(--gold); border-bottom: 2px solid var(--ember); font-weight: 600; }
  @media (max-width: 900px) { .col-6 { grid-column: span 12; } .grid-container { padding: 16px; } }
</style>
</head>
<body>

<div id="scene"><div id="sky"></div></div>

<div id="auth-overlay">
  <div class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Đăng Nhập</div>
      <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Tạo Tài Khoản</div>
    </div>
    <form id="form-login" onsubmit="handleAuth(event, 'login')">
      <div class="field"><label>Tên đăng nhập</label><input type="text" id="login-user" class="input" required></div>
      <div class="field"><label>Mật khẩu</label><input type="password" id="login-pass" class="input" required></div>
      <button type="submit" class="btn" style="width: 100%; margin-top: 12px;">ĐĂNG NHẬP PANEL</button>
    </form>
    <form id="form-register" onsubmit="handleAuth(event, 'register')" style="display: none;">
      <div class="field"><label>Tên tài khoản mới</label><input type="text" id="reg-user" class="input" required></div>
      <div class="field"><label>Mật khẩu</label><input type="password" id="reg-pass" class="input" required></div>
      <button type="submit" class="btn" style="width: 100%; margin-top: 12px;">ĐĂNG KÝ TÀI KHOẢN</button>
    </form>
  </div>
</div>

<div id="app-workspace">
  <nav class="navbar">
    <div class="brand-title">DISCORD CLOUD CONTROLLER</div>
    <div class="user-badge">
      <span id="display-user-name">---</span>
      <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="logout()">Thoát</button>
    </div>
  </nav>

  <main class="grid-container">
    <section class="card-panel col-6">
      <div class="card-header">TREO DISCORD RPC (CUSTOM STATUS)</div>
      <form onsubmit="createWorker(event, 'RPC')">
        <div class="field"><label>User Token</label><input type="password" id="rpc-token" class="input" required></div>
        <div class="field"><label>Tên Game/App</label><input type="text" id="rpc-name" class="input" placeholder="Visual Studio Code" required></div>
        <div class="row-2">
          <div class="field"><label>Details</label><input type="text" id="rpc-details" class="input"></div>
          <div class="field"><label>State</label><input type="text" id="rpc-state" class="input"></div>
        </div>
        <button type="submit" class="btn" style="width: 100%;">KÍCH HOẠT RPC</button>
      </form>
    </section>

    <section class="card-panel col-6">
      <div class="card-header">TREO VOICE CHANNEL (24/7)</div>
      <form onsubmit="createWorker(event, 'VOICE')">
        <div class="field"><label>User Token</label><input type="password" id="voice-token" class="input" required></div>
        <div class="field"><label>Guild ID (Server ID)</label><input type="text" id="voice-guild" class="input" required></div>
        <div class="field"><label>Voice Channel ID</label><input type="text" id="voice-channel" class="input" required></div>
        <div class="row-2">
          <div class="field"><label>Tắt Mic</label><select id="voice-mute" class="input"><option value="true">Có</option><option value="false">Không</option></select></div>
          <div class="field"><label>Tắt Tai Nghe</label><select id="voice-deaf" class="input"><option value="true">Có</option><option value="false">Không</option></select></div>
        </div>
        <button type="submit" class="btn" style="width: 100%;">KÍCH HOẠT VOICE</button>
      </form>
    </section>

    <section class="card-panel col-12">
      <div class="card-header">DANH SÁCH WORKER CỦA BẠN</div>
      <div id="worker-list" class="worker-grid"></div>
    </section>
  </main>
</div>

<script>
  // ĐIỀN LINK RENDER CỦA BẠN VÀO ĐÂY (Thay thế link bên dưới)
  const API_URL = 'https://my-discord-bot-node.onrender.com';

  let activeUser = localStorage.getItem('app_active_user') || null;
  function getUsersDB() { return JSON.parse(localStorage.getItem('app_users_db') || '{}'); }

  function switchAuthTab(type) {
    document.getElementById('tab-login').classList.toggle('active', type === 'login');
    document.getElementById('tab-register').classList.toggle('active', type === 'register');
    document.getElementById('form-login').style.display = type === 'login' ? 'block' : 'none';
    document.getElementById('form-register').style.display = type === 'register' ? 'block' : 'none';
  }

  function handleAuth(e, type) {
    e.preventDefault();
    const db = getUsersDB();
    if (type === 'register') {
      const u = document.getElementById('reg-user').value.trim();
      const p = document.getElementById('reg-pass').value.trim();
      if (db[u]) return alert('Tài khoản đã tồn tại!');
      db[u] = { password: p };
      localStorage.setItem('app_users_db', JSON.stringify(db));
      alert('Tạo tài khoản thành công!');
      switchAuthTab('login');
      return;
    }
    if (type === 'login') {
      const u = document.getElementById('login-user').value.trim();
      const p = document.getElementById('login-pass').value.trim();
      if (!db[u] || db[u].password !== p) return alert('Sai tài khoản hoặc mật khẩu!');
      activeUser = u;
      localStorage.setItem('app_active_user', u);
      bootSession();
    }
  }

  function logout() {
    localStorage.removeItem('app_active_user');
    activeUser = null;
    bootSession();
  }

  function bootSession() {
    const overlay = document.getElementById('auth-overlay');
    if (!activeUser) {
      overlay.style.display = 'flex';
    } else {
      overlay.style.display = 'none';
      document.getElementById('display-user-name').innerText = activeUser;
      renderWorkers();
    }
  }

  function getWorkers() { return JSON.parse(localStorage.getItem(`workers_${activeUser}`) || '[]'); }
  function saveWorkers(data) { localStorage.setItem(`workers_${activeUser}`, JSON.stringify(data)); }

  async function createWorker(e, type) {
    e.preventDefault();
    const list = getWorkers();
    const worker = { id: Date.now(), type, userOwner: activeUser };

    if (type === 'RPC') {
      worker.token = document.getElementById('rpc-token').value.trim();
      worker.name = document.getElementById('rpc-name').value.trim();
      worker.details = document.getElementById('rpc-details').value.trim();
      worker.state = document.getElementById('rpc-state').value.trim();
    } else {
      worker.token = document.getElementById('voice-token').value.trim();
      worker.guildId = document.getElementById('voice-guild').value.trim();
      worker.channelId = document.getElementById('voice-channel').value.trim();
      worker.mute = document.getElementById('voice-mute').value === 'true';
      worker.deaf = document.getElementById('voice-deaf').value === 'true';
    }

    try {
      const res = await fetch(`${API_URL}/api/worker/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(worker)
      });
      const data = await res.json();
      if (data.success) {
        list.push(worker);
        saveWorkers(list);
        renderWorkers();
        e.target.reset();
        alert(data.message);
      } else { alert('Lỗi: ' + data.message); }
    } catch (err) { alert('Không thể kết nối đến Render Backend!'); }
  }

  async function deleteWorker(id) {
    try {
      await fetch(`${API_URL}/api/worker/stop`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
    } catch (err) {}
    const list = getWorkers().filter(w => w.id !== id);
    saveWorkers(list);
    renderWorkers();
  }

  function renderWorkers() {
    const container = document.getElementById('worker-list');
    const list = getWorkers();
    container.innerHTML = '';
    if (list.length === 0) {
      container.innerHTML = '<div style="grid-column: span 12; text-align: center;">Chưa có worker nào.</div>';
      return;
    }
    list.forEach(w => {
      const card = document.createElement('div');
      card.className = 'worker-item';
      card.innerHTML = `
        <div>
          <b style="color:var(--status-active);">ONLINE — ${w.type}</b>
          <div style="margin-top:8px;">${w.type === 'RPC' ? 'App: ' + w.name : 'Channel: ' + w.channelId}</div>
        </div>
        <button class="btn btn-danger" onclick="deleteWorker(${w.id})">Tắt & Xóa Worker</button>
      `;
      container.appendChild(card);
    });
  }

  bootSession();
</script>
</body>
</html>
